name: Refresh e2e shard weights
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

permissions: {}

env:
  # renovate: datasource=golang-version packageName=golang
  GOLANG_VERSION: '1.27.3'
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh e2e shard weights
    if: github.repository == 'argoproj/argo-cd'
    runs-on: ubuntu-24.04
    permissions:
      actions: read # to list CI runs and download their timing artifacts
      contents: read
    env:
      BRANCH: e2e-shard-weights-refresh
      MAX_RUNS: '10'
      MIN_RUNS: '3'
      DAYS: '7'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: false

      - name: Download e2e timings
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shards=$(yq '.jobs.changes.steps[] | select(.id == "shards") | .env.SHARD_COUNT' .github/workflows/ci-build.yaml)
          count=$(hack/e2e-shard-weights-download.sh "${RUNNER_TEMP}/runs" "${shards}" "${MAX_RUNS}" "${DAYS}")
          if [ "${count}" -lt "${MIN_RUNS}" ]; then
            echo "::warning::Only ${count} builds with e2e timings in the last ${DAYS} days, need ${MIN_RUNS}; the shard weights are left unchanged."
          fi
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Compute refreshed weights
        if: ${{ fromJSON(steps.download.outputs.count) >= fromJSON(env.MIN_RUNS) }}
        env:
          SHARDS: ${{ steps.download.outputs.shards }}
        run: |
          go run ./hack/e2e-shard-weights-refresh \
            -shards "${SHARDS}" \
            -report "${RUNNER_TEMP}/report.md" \
            -repo "${GITHUB_REPOSITORY}" \
            "${RUNNER_TEMP}"/runs/*

      - name: Generate a token
        id: generate-token
        if: ${{ fromJSON(steps.download.outputs.count) >= fromJSON(env.MIN_RUNS) }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CHERRYPICK_APP_ID }}
          private-key: ${{ secrets.CHERRYPICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open, update or close the refresh PR
        if: ${{ fromJSON(steps.download.outputs.count) >= fromJSON(env.MIN_RUNS) }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -eu
          report="${RUNNER_TEMP}/report.md"
          pr=$(gh pr list -R "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base master --state open \
            --json number,headRepositoryOwner \
            --jq "map(select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")) | .[0].number // empty")

          if [ ! -f "${report}" ]; then
            if [ -n "${pr}" ]; then
              gh pr close -R "${GITHUB_REPOSITORY}" "${pr}" --delete-branch \
                --comment "The e2e timings of the last ${DAYS} days no longer justify a change to the shard weights."
            fi
            exit 0
          fi

          weights=test/e2e/shard-weights.txt
          cp "${weights}" "${RUNNER_TEMP}/weights.txt"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "${pr}" ]; then
            git fetch --quiet --depth=1 "${remote}" "${BRANCH}"
            git checkout --quiet --force -B "${BRANCH}" FETCH_HEAD
            cp "${RUNNER_TEMP}/weights.txt" "${weights}"
          else
            git checkout --quiet -B "${BRANCH}"
          fi

          if git diff --quiet -- "${weights}"; then
            echo "PR #${pr} already has these weights"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${weights}"
            git commit --signoff -m "chore: refresh e2e shard weights"
            git push --force "${remote}" "HEAD:refs/heads/${BRANCH}"
          fi

          if [ -n "${pr}" ]; then
            gh pr edit -R "${GITHUB_REPOSITORY}" "${pr}" --body-file "${report}"
          else
            gh pr create -R "${GITHUB_REPOSITORY}" --base master --head "${BRANCH}" \
              --title "chore: refresh e2e shard weights" --body-file "${report}"
          fi
