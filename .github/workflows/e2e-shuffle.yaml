name: E2E shuffle check

# Runs the FULL e2e suite (no shard filter) in randomised order, several orderings in
# parallel, to show that the suite does not depend on the order its tests run in. That
# property is what lets ci-build.yaml split the suite across shards: if it ever stops
# holding -- someone adds a test that leans on state left by another -- the split breaks
# silently, and this is what catches it.
#
# Not part of the normal PR run; it costs ~350 machine-minutes. Add the ci/e2e-shuffle
# label to a pull request to run it against that PR's code.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

env:
  # renovate: datasource=golang-version packageName=golang
  GOLANG_VERSION: '1.27.1'
  # Order dependence is not specific to a Kubernetes version, so pin one and spend the
  # runner budget on more orderings instead.
  K3S_VERSION: v1.37.0-rc3
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}

permissions:
  contents: read

jobs:
  seeds:
    name: Pick shuffle seeds
    # Gate lives here; the shuffle job needs this one, so skipping it skips the matrix too.
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci/e2e-shuffle' }}
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Pick seeds
        id: pick
        env:
          SEED_COUNT: '5'
        # Drawn from /dev/urandom rather than hardcoded, so every run explores fresh
        # orderings instead of re-testing the same five forever. They are written to the
        # run summary and carried in the job and artifact names, so each ordering stays
        # reproducible by anyone who wants to re-run it.
        run: |
          set -eu
          seeds=""
          for _ in $(seq 1 "$SEED_COUNT"); do
            s=$(od -An -N4 -tu4 < /dev/urandom | tr -d ' ')
            seeds="${seeds:+$seeds,}$((s + 1))"
          done
          echo "list=[$seeds]" >> "$GITHUB_OUTPUT"
          {
            echo "### Shuffle seeds for this run"
            echo
            echo 'Reproduce a single ordering locally with:'
            echo
            echo '```'
            echo 'make test-e2e-local ARGOCD_E2E_RERUN_FAILS=0 ARGOCD_E2E_TEST_TIMEOUT="150m -shuffle=<seed>"'
            echo '```'
            echo
            for s in $(echo "$seeds" | tr ',' ' '); do echo "- \`$s\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  shuffle:
    name: e2e shuffled (seed ${{ matrix.seed }})
    needs: seeds
    runs-on: ${{ github.repository == 'argoproj/argo-cd' && 'oracle-vm-16cpu-64gb-x86-64' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.list) }}
    env:
      ARGOCD_FAKE_IN_CLUSTER: 'true'
      ARGOCD_E2E_K3S: 'true'
      ARGOCD_IN_CI: 'true'
      ARGOCD_E2E_APISERVER_PORT: '8088'
      ARGOCD_APPLICATION_NAMESPACES: 'argocd-e2e-external,argocd-e2e-external-2'
      ARGOCD_SERVER: '127.0.0.1:8088'
      GITHUB_TOKEN: ${{ secrets.E2E_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.E2E_TEST_GITLAB_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: false
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: false
      - name: Set GOPATH
        run: |
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version packageName=node versioning=node
          node-version: '24.17.0'
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - name: GH actions workaround - Kill XSP4 process
        run: |
          sudo pkill mono || true
      - name: Install K3S
        env:
          INSTALL_K3S_VERSION: ${{ env.K3S_VERSION }}+k3s1
        run: |
          set -x
          curl -sfL https://get.k3s.io | sh -
          sudo chmod -R a+rw /etc/rancher/k3s
          sudo mkdir -p $HOME/.kube && sudo chown -R $(whoami) $HOME/.kube
          sudo k3s kubectl config view --raw > $HOME/.kube/config
          sudo chown $(whoami) $HOME/.kube/config
          sudo chmod go-r $HOME/.kube/config
          kubectl version
      - name: Restore go build and module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-v1-
      - name: Add ~/go/bin to PATH
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Add /usr/local/bin to PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Add ./dist to PATH
        run: |
          echo "$(pwd)/dist" >> $GITHUB_PATH
      - name: Download Go modules
        run: |
          go mod download
      - name: Install goreman
        run: |
          go install github.com/mattn/goreman@v0.3.17
      - name: Install all tools required for building & testing
        run: |
          make install-test-tools-local
      - name: Setup git username and email
        run: |
          git config --global user.name "John Doe"
          git config --global user.email "john.doe@example.com"
      - name: Pull Docker image required for tests
        run: |
          # renovate: datasource=github-releases depName=dexidp/dex
          docker pull ghcr.io/dexidp/dex:v2.45.1
          docker pull argoproj/argo-cd-ci-builder:v1.0.0
          # renovate: datasource=docker packageName=docker.io/library/redis
          docker pull redis:8.10.1-alpine
      - name: Create target directory for binaries in the build-process
        run: |
          mkdir -p dist
          chown $(whoami) dist
      - name: Run E2E server and wait for it being available
        timeout-minutes: 30
        run: |
          set -x
          make start-e2e-local 2>&1 | sed -r "s/[[:cntrl:]]\[[0-9]{1,3}m//g" > /tmp/e2e-server.log &
          count=1
          until curl -f http://127.0.0.1:8088/healthz; do
            sleep 10;
            if test $count -ge 180; then
              echo "Timeout"
              exit 1
            fi
            count=$((count+1))
          done
      - name: Run the full suite in randomised order
        # Two deliberate departures from normal CI:
        #  - ARGOCD_E2E_RERUN_FAILS=0. gotestsum normally retries a failure up to 5 times,
        #    and a retry runs the test on its own -- exactly the condition under which an
        #    order-dependent failure passes. Retries would hide what this run looks for.
        #  - the shard variables are left unset, so hack/test.sh applies no -run filter and
        #    all 522 tests run in one process, in the order the seed picks.
        # The trailing flag rides on ARGOCD_E2E_TEST_TIMEOUT because the Makefile expands it
        # unquoted into the go test command line. Slightly cheeky, but it keeps the tree
        # byte-identical to the PR branch: only the invocation differs.
        # The seed goes through env rather than being expanded straight into the script:
        # a ${{ }} expansion inside run: is a template-injection sink, and zizmor flags the
        # shape regardless of whether this particular value happens to be safe.
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -x
          echo "shuffle seed: ${SEED}"
          make test-e2e-local \
            ARGOCD_E2E_RERUN_FAILS=0 \
            ARGOCD_E2E_TEST_TIMEOUT="150m -shuffle=${SEED}"
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shuffle-seed-${{ matrix.seed }}
          path: |
            test-results/junit.xml
            /tmp/e2e-server.log
