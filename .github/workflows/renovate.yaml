name: Renovate
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # a workaround to disable harden runner
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
  
jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-24.04
    if: github.repository == 'argoproj/argo-cd'
    steps:
      - name: Harden the runner (Block unknown outbound calls)
        if: ${{ vars.disable_harden_runner != 'true' }}
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: "false" # renovatebot runs in `docker run`
          # Blocked egress does not fail this job: harden-runner only reports it, and
          # Renovate treats an unreachable datasource as a per-dependency warning and
          # still exits 0. The errors are supposed to be logged in the Renovate Dashboard.
          #
          # The apt mirrors are on port 80 on purpose: that is what
          # the distro sources inside the Renovate image have, and apt
          # authenticates packages with GPG rather than TLS.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            hub.docker.com:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            proxy.golang.org:443
            nodejs.org:443
            pypi.org:443
            get.helm.sh:443
            registry.npmjs.org:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            deb.debian.org:80
            deb.debian.org:443
            production.cloudfront.docker.com:443
            dandydeveloper.github.io:443

      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # master, plus the supported release-* branches from
      # hack/supported-release-branches.sh. release-branches.json5 then limits
      # those release branches to Go, Helm, and Kustomize patch bumps. Without
      # this env var, Renovate updates master only.
      - name: Select Renovate base branches
        id: base_branches
        run: |
          set -euo pipefail
          json='["master"'
          # Assign before the loop. A process substitution would hide a failed
          # script, and Renovate would update master only.
          release_branches="$(hack/supported-release-branches.sh)"
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            json+=",\"${branch}\""
          done <<< "$release_branches"
          json+=']'
          echo "Renovate base branches: ${json}"
          echo "branches=${json}" >> "$GITHUB_OUTPUT"

      # Unlike every other action here, the `uses:` pin below is managed by Renovate
      # rather than dependabot, so its update will be grouped into the same PR
      # as the image (below).
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/configs/renovate-config.js
          token: '${{ steps.get_token.outputs.token }}'
          # The action runs `docker run <renovate-image>:<renovate-version>`, so pinning
          # `renovate-version` to `<tag>@sha256:<digest>` gives a fully pinned image
          # reference instead of the floating major tag the action defaults to.
          #
          # Both the tag and the digest are kept up to date by the custom manager in
          # renovate-presets/custom-managers/renovate-action.json5, which expects
          # `renovate-image` and `renovate-version` to stay on adjacent lines.
          renovate-image: "ghcr.io/renovatebot/renovate"
          renovate-version: "44.167.6@sha256:7a99aeb8faaf30c8f7ae9d2d723b1dac131067bd2adf1579826c44ba2fad67d5"
        env:
          LOG_LEVEL: 'debug'
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
          RENOVATE_BASE_BRANCHES: '${{ steps.base_branches.outputs.branches }}'
