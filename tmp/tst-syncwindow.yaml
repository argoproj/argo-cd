apiVersion: argoproj.io/v1alpha1
kind: SyncWindow
metadata:
  name: nightly-freeze-sw
  namespace: argocd
  labels:
    env: prod
    team: platform
spec:
  windows:
    - kind: deny
      schedule: "0 * * * *"
      duration: "24h"
      applications:
        - "tst"
      description: "Nightly maintenance freeze"
