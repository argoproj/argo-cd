apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: argocd-repo-server-headless
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: repo-server
  name: argocd-repo-server-headless
spec:
  # Headless Service: DNS returns one A record per repo-server pod instead of a single ClusterIP.
  # Clients that dial dns:///argocd-repo-server-headless:8081 with round-robin load balancing then
  # spread requests (and ResourceExhausted retries) across all pods, including newly scaled-out ones.
  clusterIP: None
  ports:
  - name: server
    protocol: TCP
    port: 8081
    targetPort: 8081
  - name: metrics
    protocol: TCP
    port: 8084
    targetPort: 8084
  selector:
    app.kubernetes.io/name: argocd-repo-server
