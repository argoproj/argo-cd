apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: argocd-audit-controller
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: audit-controller
  name: argocd-audit-controller
spec:
  # A single replica: every record is written to this pod's log, and the in-memory
  # query buffer would otherwise be split between replicas.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-audit-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-audit-controller
    spec:
      serviceAccountName: argocd-audit-controller
      containers:
      - name: argocd-audit-controller
        image: quay.io/argoproj/argocd:latest
        imagePullPolicy: Always
        args:
          - /usr/local/bin/argocd-audit-controller
        env:
          - name: ARGOCD_AUDIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: argocd-audit-token
                key: token
          - name: ARGOCD_AUDIT_CONTROLLER_LOGFORMAT
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.log.format
                optional: true
          - name: ARGOCD_AUDIT_CONTROLLER_LOGLEVEL
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.log.level
                optional: true
          - name: ARGOCD_LOG_FORMAT_TIMESTAMP
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: log.format.timestamp
                optional: true
          - name: ARGOCD_AUDIT_CONTROLLER_BUFFER_SIZE
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.buffer.size
                optional: true
          - name: ARGOCD_AUDIT_CONTROLLER_LOG_FILE
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.log.file
                optional: true
          - name: ARGOCD_AUDIT_CONTROLLER_WATCH_EVENTS
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.watch.events
                optional: true
          - name: ARGOCD_AUDIT_CONTROLLER_EVENT_NAMESPACES
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.event.namespaces
                optional: true
          - name: ARGOCD_AUDIT_CONTROLLER_EVENT_REASONS
            valueFrom:
              configMapKeyRef:
                name: argocd-cmd-params-cm
                key: auditcontroller.event.reasons
                optional: true
        ports:
        - containerPort: 8088
        - containerPort: 8089
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8088
          initialDelaySeconds: 3
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        # Mount a persistent volume here and set auditcontroller.log.file to keep a copy of the audit trail
        # that survives pod restarts, in addition to the pod log.
        - name: audit-log
          mountPath: /app/audit
      volumes:
        - name: audit-log
          emptyDir: {}
