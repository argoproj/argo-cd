apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: argocd-audit-controller
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: audit-controller
  name: argocd-audit-controller
rules:
# The audit controller turns the events Argo CD emits for its own objects (automated syncs, sync results,
# resource actions...) into audit records. It needs nothing else.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch
