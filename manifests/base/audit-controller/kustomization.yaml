apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- argocd-audit-controller-sa.yaml
- argocd-audit-controller-role.yaml
- argocd-audit-controller-rolebinding.yaml
- argocd-audit-controller-deployment.yaml
- argocd-audit-controller-service.yaml
- argocd-audit-controller-network-policy.yaml

# Because the audit controller is added as a resource outside the base, we have to explicitly set the image override here.
images:
- name: quay.io/argoproj/argocd
  newName: quay.io/argoproj/argocd
  newTag: latest
