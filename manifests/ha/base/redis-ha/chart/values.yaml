redis-ha:
  auth: true
  authKey: auth
  existingSecret: argocd-redis
  persistentVolume:
    enabled: false
  redis:
    masterGroupName: argocd
    config:
      save: '""'
      # listen on IPv4, and on IPv6 when available ("-" marks the address optional)
      bind: '* -::*'
  haproxy:
    enabled: true
    IPv6:
      enabled: false
    image:
      tag: 3.0.8-alpine
    timeout:
      server: 6m
      client: 6m
    checkInterval: 3s
    metrics:
      enabled: true
    extraConfig: |
      global
        maxconn 4096
    serviceAccount:
      automountToken: true
  image:
    # renovate: datasource=docker packageName=docker.io/library/redis
    tag: 8.10.2-alpine
  sentinel:
    bind: '* -::*'
    lifecycle:
      postStart:
        exec:
          command:
            - '/bin/sh'
            - '-c'
            - 'sleep 30; redis-cli -p 26379 sentinel reset argocd'
