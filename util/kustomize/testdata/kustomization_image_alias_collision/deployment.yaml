apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: main
          image: my-image
        - name: other
          image: other-image
        - name: aliased
          image: aliased-nginx
        - name: sidecar
          image: nginx:1.15.4
