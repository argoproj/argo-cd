apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
images:
  - name: my-image
    newName: ghcr.io/my-org/shared
    newTag: v1
  - name: other-image
    newName: ghcr.io/my-org/shared
    newTag: v2
  - name: aliased-nginx
    newName: nginx
    newTag: v3
