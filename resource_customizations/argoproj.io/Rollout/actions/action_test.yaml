actionTests:
- action: resume
  inputPath: testdata/pre_v0.6_paused_rollout.yaml
  expectedOutputPath: testdata/pre_v0.6_not_paused_rollout.yaml
- action: resume
  inputPath: testdata/has_pause_condition_rollout.yaml
  expectedOutputPath: testdata/no_pause_condition_rollout.yaml
- action: resume
  inputPath: testdata/no_status_paused_rollout.yaml
  expectedOutputPath: testdata/no_status_resumed_rollout.yaml
- action: abort
  inputPath: testdata/has_pause_condition_rollout.yaml
  expectedOutputPath: testdata/has_pause_condition_rollout_aborted.yaml
- action: restart
  inputPath: testdata/rollout_not_restarted.yaml
  expectedOutputPath: testdata/rollout_restarted.yaml
- action: retry
  inputPath: testdata/v0.9_aborted_rollout.yaml
  expectedOutputPath: testdata/retried_rollout.yaml
- action: promote-full
  inputPath: testdata/v0.9_aborted_rollout.yaml
  expectedOutputPath: testdata/v0.9_promote-full_rollout.yaml
- action: promote-full
  inputPath: testdata/aborted_rollout.yaml
  expectedOutputPath: testdata/promote-full_rollout.yaml
- action: skip-current-step
  inputPath: testdata/rollout-step1.yaml
  expectedOutputPath: testdata/rollout-step1-after-skip-current-step.yaml
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedOutputPath: testdata/three_replica_rollout.yaml
  parameters:
    replicas: "3"
- action: scale
  inputPath: testdata/three_replica_rollout.yaml
  expectedOutputPath: testdata/one_replica_rollout.yaml
  parameters:
    replicas: "1"
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedOutputPath: testdata/zero_replica_rollout.yaml
  parameters:
    replicas: "0"
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedErrorMessage: "invalid number: not_a_number"
  parameters:
    replicas: "not_a_number"
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedErrorMessage: "invalid number: -1"
  parameters:
    replicas: "-1"
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedErrorMessage: "invalid number: 1.5"
  parameters:
    replicas: "1.5"
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedErrorMessage: "invalid number: 2147483648"
  parameters:
    replicas: "2147483648"
- action: scale
  inputPath: testdata/one_replica_rollout.yaml
  expectedErrorMessage: "replicas parameter is required"
