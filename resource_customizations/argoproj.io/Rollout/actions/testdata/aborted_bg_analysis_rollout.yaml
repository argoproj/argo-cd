apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: retry-analysis
  namespace: default
spec:
  replicas: 3
  paused: false
  selector:
    matchLabels:
      app: retry-analysis
  template:
    metadata:
      labels:
        app: retry-analysis
    spec:
      containers:
      - name: app
        image: nginx:1.19-alpine
  strategy:
    blueGreen:
      activeService: active
      previewService: preview
      prePromotionAnalysis:
        templates:
        - templateName: success-rate
      postPromotionAnalysis:
        templates:
        - templateName: success-rate
status:
  abort: true
  abortedAt: '2020-11-13T08:38:19Z'
  currentPodHash: candidate
  stableRS: stable
  controllerPause: true
  pauseConditions:
  - reason: InconclusiveAnalysis
    startTime: '2020-11-13T08:37:53Z'
  blueGreen:
    activeSelector: stable
    previewSelector: candidate
    prePromotionAnalysisRunStatus:
      name: retry-analysis-pre
      status: Failed
    postPromotionAnalysisRunStatus:
      name: retry-analysis-post
      status: Error
