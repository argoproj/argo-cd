tests:
- healthStatus:
    status: Progressing
    message: Initializing active commit restore
  inputPath: testdata/no-status.yaml
- healthStatus:
    status: Progressing
    deletionMessage: RestoreActiveCommit is being deleted
  inputPath: testdata/deleting.yaml
- healthStatus:
    status: Progressing
    message: Waiting for RestoreActiveCommit spec update to be observed
  inputPath: testdata/observed-generation-outdated.yaml
- healthStatus:
    status: Degraded
    message: "Active commit restore failed: Reconciliation failed: PromotionStrategy not found"
  inputPath: testdata/reconcile-error.yaml
- healthStatus:
    status: Progressing
    message: RestoreActiveCommit Ready condition is missing
  inputPath: testdata/no-ready-condition.yaml
- healthStatus:
    status: Progressing
    message: Rollback has not completed
  inputPath: testdata/rollback-pending.yaml
- healthStatus:
    status: Healthy
    message: Environment environment/production is blocked at 1111111111111111111111111111111111111111
  inputPath: testdata/blocked.yaml
- healthStatus:
    status: Healthy
    message: Environment block released for environment/production
  inputPath: testdata/released.yaml
