tests:
- healthStatus:
    status: Progressing
    message: Initializing scheduled commit gate
  inputPath: testdata/no-status.yaml
- healthStatus:
    status: Progressing
    deletionMessage: ScheduledCommitStatus is being deleted
  inputPath: testdata/deleting.yaml
- healthStatus:
    status: Progressing
    message: Waiting for ScheduledCommitStatus spec update to be observed
  inputPath: testdata/observed-generation-outdated.yaml
- healthStatus:
    status: Degraded
    message: "Scheduled commit gate failed: Reconciliation failed: PromotionStrategy not found"
  inputPath: testdata/reconcile-error.yaml
- healthStatus:
    status: Progressing
    message: ScheduledCommitStatus Ready condition is missing
  inputPath: testdata/no-ready-condition.yaml
- healthStatus:
    status: Healthy
    message: Scheduled commit gate reconciled
  inputPath: testdata/empty-environments.yaml
- healthStatus:
    status: Progressing
    message: "Scheduled commit gate pending for branch(es): environment/staging"
  inputPath: testdata/environment-pending.yaml
- healthStatus:
    status: Degraded
    message: "Scheduled commit gate failed for branch(es): environment/production"
  inputPath: testdata/environment-failure.yaml
- healthStatus:
    status: Healthy
    message: Scheduled commit gate satisfied for 2 environment(s)
  inputPath: testdata/all-success.yaml
