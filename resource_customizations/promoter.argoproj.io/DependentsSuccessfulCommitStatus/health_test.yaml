tests:
- healthStatus:
    status: Progressing
    message: Initializing dependents gate
  inputPath: testdata/no-status.yaml
- healthStatus:
    status: Progressing
    deletionMessage: DependentsSuccessfulCommitStatus is being deleted
  inputPath: testdata/deleting.yaml
- healthStatus:
    status: Progressing
    message: Waiting for DependentsSuccessfulCommitStatus spec update to be observed
  inputPath: testdata/observed-generation-outdated.yaml
- healthStatus:
    status: Degraded
    message: "Dependents gate failed: Reconciliation failed: PromotionStrategy not found"
  inputPath: testdata/reconcile-error.yaml
- healthStatus:
    status: Progressing
    message: DependentsSuccessfulCommitStatus Ready condition is missing
  inputPath: testdata/no-ready-condition.yaml
- healthStatus:
    status: Healthy
    message: Dependents gate reconciled
  inputPath: testdata/empty-environments.yaml
- healthStatus:
    status: Progressing
    message: "Dependents gate pending for branch(es): environment/prod"
  inputPath: testdata/environment-pending.yaml
- healthStatus:
    status: Progressing
    message: "Dependents gate waiting on upstreams for branch(es): environment/prod"
  inputPath: testdata/upstream-waiting.yaml
- healthStatus:
    status: Degraded
    message: "Dependents gate failed for branch(es): environment/prod"
  inputPath: testdata/environment-failure.yaml
- healthStatus:
    status: Healthy
    message: Dependents gate satisfied for 2 environment(s)
  inputPath: testdata/all-success.yaml
