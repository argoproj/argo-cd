tests:
- healthStatus:
    status: Progressing
    message: Initializing promotion history
  inputPath: testdata/no-status.yaml
- healthStatus:
    status: Progressing
    deletionMessage: Promotion history is being deleted
  inputPath: testdata/deleting.yaml
- healthStatus:
    status: Progressing
    message: Waiting for ChangeTransferPolicyHistory spec update to be observed
  inputPath: testdata/observed-generation-outdated.yaml
- healthStatus:
    status: Degraded
    message: "Promotion history failed: Reconciliation failed: GitRepository not found"
  inputPath: testdata/reconcile-error.yaml
- healthStatus:
    status: Progressing
    message: ChangeTransferPolicyHistory Ready condition is missing
  inputPath: testdata/no-ready-condition.yaml
- healthStatus:
    status: Healthy
    message: Promotion history is ready
  inputPath: testdata/healthy.yaml
