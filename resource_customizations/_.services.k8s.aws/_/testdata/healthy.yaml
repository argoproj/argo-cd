apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: test-s3-bucket
  namespace: default
  # Spec write is older than the grace window. ResourceSynced still predates that
  # write (metadata-only apply, or a reconcile that has not happened yet). A future
  # argocd entry that does not own spec must not keep the resource Progressing.
  managedFields:
  - manager: argocd-controller
    operation: Update
    apiVersion: s3.services.k8s.aws/v1alpha1
    time: "2099-01-01T00:00:00Z"
    fieldsType: FieldsV1
    fieldsV1:
      'f:metadata':
        'f:labels': {}
  - manager: argocd-controller
    operation: Apply
    apiVersion: s3.services.k8s.aws/v1alpha1
    time: "2020-01-02T00:00:00Z"
    fieldsType: FieldsV1
    fieldsV1:
      'f:spec':
        'f:name': {}
spec:
  name: test-s3-bucket
status:
  ackResourceMetadata:
    arn: arn:aws:s3:::test-s3-bucket
    ownerAccountID: "111111111111"
    region: us-west-2
  conditions:
  - lastTransitionTime: "2020-01-01T00:00:00Z"
    message: Resource synced successfully
    reason: ""
    status: "True"
    type: ACK.ResourceSynced
  - lastTransitionTime: "2020-01-01T00:00:00Z"
    message: Resource synced successfully
    reason: ""
    status: "True"
    type: Ready
  location: http://test-s3-bucket.s3.amazonaws.com/
