tests:
- healthStatus:
    status: Progressing
    message: "Waiting for KafkaMirrorMaker2"
  inputPath: testdata/progressing_noStatus.yaml
- healthStatus:
    status: Progressing
    message: "Waiting for KafkaMirrorMaker2 spec update to be observed"
  inputPath: testdata/progressing_oldGeneration.yaml
- healthStatus:
    status: Degraded
    message: "Failed to connect to the source cluster"
  inputPath: testdata/degraded.yaml
- healthStatus:
    status: Degraded
    message: "Task 0 of connector source->target.MirrorSourceConnector is FAILED"
  inputPath: testdata/degraded_failedTask.yaml
- healthStatus:
    status: Suspended
    message: "Reconciliation is paused"
  inputPath: testdata/suspended.yaml
- healthStatus:
    status: Healthy
    message: ""
  inputPath: testdata/healthy.yaml
