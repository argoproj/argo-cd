apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: example-backendtlspolicy
  namespace: default
  generation: 1
spec:
  targetRefs:
  - group: gateway.kgateway.dev
    kind: Backend
    name: example-backend
  validation:
    hostname: example.com
    wellKnownCACertificates: System
status:
  ancestors:
  # The controller actually responsible for the target accepted and applied
  # the policy correctly.
  - ancestorRef:
      group: gateway.kgateway.dev
      kind: Backend
      name: example-backend
    conditions:
    - lastTransitionTime: '2026-04-16T12:30:30Z'
      message: All references are resolved
      observedGeneration: 1
      reason: ResolvedRefs
      status: 'True'
      type: ResolvedRefs
    - lastTransitionTime: '2026-04-16T12:20:11Z'
      message: BackendTLSPolicy is accepted
      observedGeneration: 1
      reason: Accepted
      status: 'True'
      type: Accepted
    controllerName: gateway.kgateway.dev/kgateway-controller
  # A second conformant implementation that also watches the CRD but was never
  # going to manage this target correctly reports that it cannot resolve the
  # target kind under its own controllerName. This must not degrade the policy.
  - ancestorRef:
      group: gateway.kgateway.dev
      kind: Backend
      name: example-backend
    conditions:
    - lastTransitionTime: '2026-04-16T12:20:11Z'
      message: 'targetRefs invalid: unsupported kind Backend'
      observedGeneration: 1
      reason: TargetNotFound
      status: 'False'
      type: Accepted
    controllerName: istio.io/mesh-controller
