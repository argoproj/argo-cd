tests:
- healthStatus:
    status: Progressing
    message: "Waiting for GeneratingPolicy status"
  inputPath: testdata/progressing.yaml
- healthStatus:
    status: Healthy
    message: "Policy is ready"
  inputPath: testdata/healthy.yaml
- healthStatus:
    status: Degraded
    message: "Admitted: webhook configuration failed"
  inputPath: testdata/degraded.yaml
- healthStatus:
    status: Progressing
    message: "Pending deletion; blocked by finalizers: example.com/finalizer"
  inputPath: testdata/terminating.yaml
