apiVersion: datadoghq.com/v1alpha1
kind: DatadogGenericResource
metadata:
  name: foo-monitor
  namespace: foo-namespace
spec:
  type: monitor
  jsonSpec: |-
    {
      "name": "foo monitor",
      "type": "metric alert",
      "query": "avg(last_5m):avg:foo.bar{*} > 1",
      "message": "foo"
    }
