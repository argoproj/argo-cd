apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cluster-ca-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Default CA bundle used to verify the Kubernetes API server of clusters whose secret does not
  # define tlsClientConfig.caData. Only applies to cluster connections, not to repositories.
  # One or more PEM encoded certificates, e.g. a root CA followed by intermediate CAs.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIID... (PEM encoded root CA certificate)
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    MIID... (PEM encoded intermediate CA certificate)
    -----END CERTIFICATE-----
